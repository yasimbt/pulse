name: Pulse

options:
  bundleIdPrefix: com.pulse
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    ARCHS: arm64
    MARKETING_VERSION: "0.4.0"
    CURRENT_PROJECT_VERSION: "4"
    # "Sign to Run Locally": ad-hoc signature, no Apple Developer account needed.
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""

packages:
  # SQLite for the history store (M3). Pinned exactly, because the generated project and its
  # Package.resolved aren't committed.
  GRDB:
    url: https://github.com/groue/GRDB.swift
    exactVersion: 7.12.0

targets:
  Pulse:
    type: application
    platform: macOS
    sources:
      - path: Pulse
    dependencies:
      - target: PulseCore
      # The command-line tool ships inside the app, next to its executable, so that it finds the
      # framework the app bundles.
      - target: pulse-cli
        embed: true
        copy:
          destination: executables
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pulse.app
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Pulse
        INFOPLIST_KEY_LSUIElement: YES # Menu-bar only: no Dock icon.
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: NO

  PulseCore:
    type: framework
    platform: macOS
    sources:
      - path: PulseCore
    dependencies:
      - package: GRDB
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pulse.core
        GENERATE_INFOPLIST_FILE: YES
        DEFINES_MODULE: YES

  pulse-cli:
    type: tool
    platform: macOS
    sources:
      - path: PulseCLI
    dependencies:
      - target: PulseCore
        embed: false
    settings:
      base:
        PRODUCT_NAME: pulse-cli
        # Inside Pulse.app (Contents/MacOS), the framework is in ../Frameworks; in a build folder,
        # it sits next to the tool.
        LD_RUNPATH_SEARCH_PATHS: "@executable_path/../Frameworks @executable_path"
        ENABLE_HARDENED_RUNTIME: YES

  PulseCoreTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: PulseCoreTests
    dependencies:
      - target: PulseCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pulse.core.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Pulse:
    build:
      targets:
        Pulse: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - PulseCoreTests
  PulseCoreTests:
    build:
      targets:
        PulseCoreTests: [test]
    test:
      config: Debug
      targets:
        - PulseCoreTests
