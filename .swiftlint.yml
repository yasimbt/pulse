included:
  - Pulse
  - PulseCore
  - PulseCoreTests
excluded:
  - build

disabled_rules:
  - large_tuple # Small labelled tuples are clearer than one-off structs for private state.
  - optional_data_string_conversion # nettop and registry bytes should decode even if malformed.

line_length:
  warning: 150
  error: 200

identifier_name:
  excluded: [id, up, to, at, db] # db: the GRDB convention for a database connection.

file_length:
  warning: 400
  error: 600

custom_rules:
  no_ui_imports_in_core:
    name: "No UI imports in PulseCore"
    message: "PulseCore must stay free of SwiftUI/AppKit so the CLI and widgets can use it."
    included: "/PulseCore/.*\\.swift$"
    regex: "^\\s*(@\\w+\\s+)?import\\s+(SwiftUI|AppKit|UIKit)\\b"
    severity: error
